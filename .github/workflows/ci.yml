name: StockMarket CI

on:
  push:
    branches:
      - ayush
  pull_request:
    branches:
      - ayush

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Validate — lint / build checks (ubuntu-latest, no Docker needed)
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm install

      - name: Validate backend syntax
        working-directory: app/backend
        run: node --check server.js

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Test — Jest + Supertest (no MongoDB required)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm install

      - name: Run tests
        working-directory: app/backend
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Security & Linting — Dockerfile linting & configuration checks
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security & Linting
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Hadolint on Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/backend/Dockerfile
          failure-threshold: error

      - name: Run Hadolint on Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/frontend/Dockerfile
          failure-threshold: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Docker — build, Trivy scan, then push (self-hosted = ARM64 kind node)
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build, Scan and Push Docker Images
    runs-on: self-hosted
    needs: security

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build images locally first (no push yet) so Trivy can scan them ──
      - name: Build backend image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-backend:${{ github.sha }}

      - name: Build frontend image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-frontend:${{ github.sha }}

      # ── Trivy security scan — fail on CRITICAL only (HIGH shown, not blocking) ──
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # ── Push only after scans pass ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-frontend:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Update Manifests — yq-patch Helm values, commit [skip ci], push
  # ─────────────────────────────────────────────────────────────────────────────
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ayush

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags in Helm values
        run: |
          yq e '.backend.image.tag = strenv(GITHUB_SHA)' -i helm/stockmarket/values.yaml
          yq e '.frontend.image.tag = strenv(GITHUB_SHA)' -i helm/stockmarket/values.yaml

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/stockmarket/values.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: update images to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:ayush

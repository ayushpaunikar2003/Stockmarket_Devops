name: StockMarket CI

on:
  push:
    branches:
      - ayush

  pull_request:
    branches:
      - ayush

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm ci

      - name: Validate backend syntax
        working-directory: app/backend
        run: node --check server.js

  docker:
    name: Build and Push Docker Images
    runs-on: self-hosted
    needs: validate

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stockmarket-frontend:${{ github.sha }}

  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ayush


- name: Update backend image tag
  run: |
    sed -i '/^backend:/,/^  image:/ {/^  tag:/s|^\( *tag:\s*\).*|\1${GITHUB_SHA}|}' helm/stockmarket/values.yaml

- name: Update frontend image tag
  run: |
    sed -i '/^frontend:/,/^  image:/ {/^  tag:/s|^\( *tag:\s*\).*|\1${GITHUB_SHA}|}' helm/stockmarket/values.yaml

- name: Commit and push manifest changes
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add helm/stockmarket/values.yaml

    if git diff --cached --quiet; then
      echo "No manifest changes"
      exit 0
    fi

    git commit -m "Update images to ${GITHUB_SHA} [skip ci]"
    git push origin HEAD:ayush
        run: |
          sed -i "s|image: dockerayush13/stockmarket-backend:.*|image: dockerayush13/stockmarket-backend:${GITHUB_SHA}|" k8s/backend.yaml

      - name: Update frontend image
        run: |
          sed -i "s|image: dockerayush13/stockmarket-frontend:.*|image: dockerayush13/stockmarket-frontend:${GITHUB_SHA}|" k8s/frontend.yaml

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml k8s/frontend.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "Update images to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:ayush
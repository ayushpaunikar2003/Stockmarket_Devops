apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockmarket
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ayushpaunikar2003/Stockmarket_Devops.git
    targetRevision: ayush
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: stockmarket

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

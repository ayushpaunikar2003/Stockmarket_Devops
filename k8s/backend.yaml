apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stockmarket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dockerayush13/stockmarket-backend:eb88ed08ffe88614e4e4c13d110c035903a59ce2
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/stockmarket
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stockmarket
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stockmarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: dockerayush13/stockmarket-frontend:eb88ed08ffe88614e4e4c13d110c035903a59ce2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockmarket
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

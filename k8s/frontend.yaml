apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stockmarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: dockerayush13/stockmarket-frontend:1672c6ddae689466aee24e3b46b9d17cd03993e8
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockmarket
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'app'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  - job_name: kubernetes-pods
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes-pods
          __path__: /var/log/pods/*/*/*.log
    pipeline_stages:
      - cri: {}
      - regex:
          expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>(?P<app>[^-]+)[^_]*)_[^/]+/(?P<container>[^/]+)/.*\.log$'
          source: filename
      - labels:
          namespace:
          pod:
          container:
          app:

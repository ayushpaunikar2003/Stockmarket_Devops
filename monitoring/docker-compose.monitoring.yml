services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    ports: 
      - "9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

    networks:
      - stockmarket-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    hostname: node-exporter
    restart: unless-stopped

    ports:
      - "9100:9100"

    command:
      - "--path.rootfs=/host"

    volumes:
      - "/:/host:ro,rslave"
  
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - stockmarket-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped

    ports:
      - "8082:8080"

    command:
      - "--docker_only=true"
      - "--housekeeping_interval=30s"

    privileged: true

    devices:
      - "/dev/kmsg"

    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:rw"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - stockmarket-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    hostname: loki
    user: "root"
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ../logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - stockmarket-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    hostname: promtail
    restart: unless-stopped

    volumes:
      - ../logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - "-config.file=/etc/promtail/config.yml"

    depends_on:
      - loki

    networks:
      - stockmarket-network

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

    networks:
      - stockmarket-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  stockmarket-network:
    external: true